syntax = "proto3";

package notification.v1;

option go_package = "gitlab.com/hiwaymedia/notification/internal/gen/proto/notification/v1;notificationv1";

import "google/protobuf/timestamp.proto";

service NotificationService {
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);
  rpc GetNotification(GetNotificationRequest) returns (GetNotificationResponse);
  rpc WatchNotificationStatus(WatchNotificationStatusRequest) returns (stream StatusEvent);
}

message SendNotificationRequest {
  string user_id        = 1;
  string type           = 2;
  string idempotency_key = 3;
  bytes  payload        = 4;
}

message SendNotificationResponse {
  string notification_id = 1;
  repeated ChannelDecision decisions = 2;
}

message GetNotificationRequest {
  string notification_id = 1;
}

message GetNotificationResponse {
  string notification_id = 1;
  string user_id         = 2;
  string type            = 3;
  repeated DeliveryStatus deliveries = 4;
  google.protobuf.Timestamp created_at = 5;
}

message WatchNotificationStatusRequest {
  string notification_id = 1;
}

message StatusEvent {
  string notification_id = 1;
  string channel         = 2;
  string status          = 3;
  string error           = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ChannelDecision {
  string channel    = 1;
  string status     = 2;
  string reason     = 3;
}

message DeliveryStatus {
  string channel    = 1;
  string status     = 2;
  int32  attempts   = 3;
  string last_error = 4;
  google.protobuf.Timestamp updated_at = 5;
}
